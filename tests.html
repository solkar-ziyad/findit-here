<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FindIt Here browser checks</title><link rel="stylesheet" href="css/tokens.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"></head><body><main class="container section"><p class="eyebrow">Developer helper</p><h1>Browser checks</h1><p>Run from a local web server.</p><button id="run" class="button button-dark">Run checks</button><ol id="out" aria-live="polite"></ol><a href="./index.html#/home">Return to the app</a></main><script type="module">
import{scoreMatch,haversineKm,tokenize}from"./js/matcher.js";import{validateReport,validEmail,validPhone,normalizeAnswer}from"./js/validation.js";import{validateImport,serializeData,storageAvailable}from"./js/storage.js";
document.querySelector("#run").onclick=()=>{const o=document.querySelector("#out");o.replaceChildren();let ok=0,bad=0;const t=(n,f)=>{try{if(!f())throw Error("assertion failed");ok++;o.append(Object.assign(document.createElement("li"),{textContent:"PASS "+n}))}catch(e){bad++;o.append(Object.assign(document.createElement("li"),{textContent:"FAIL "+n+" "+e.message}))}};
t("category and color influence score",()=>scoreMatch({type:"lost",category:"Keys",color:"silver",title:"keys"},{type:"found",category:"Keys",color:"silver",title:"keys"}).score>scoreMatch({type:"lost",category:"Keys"},{type:"found",category:"Pets"}).score);
t("same type cannot match",()=>scoreMatch({type:"lost"},{type:"lost"}).score===0);t("Haversine same point is zero",()=>haversineKm({lat:1,lng:2},{lat:1,lng:2})===0);t("tokenizer strips punctuation",()=>tokenize("blue-bottle!").join(" ")==="blue bottle");
t("contact checks",()=>validEmail("a@example.org")&&validPhone("+1 (555) 555-1234")&&!validEmail("bad"));t("answer normalization",()=>normalizeAnswer(" BLUE   tag ")==="blue tag");
t("report validation",()=>validateReport({type:"found",title:"Keys",description:"Three keys",date:"today",locationName:"Park",category:"Keys",placeType:"Park",contactType:"email",contact:"a@b.co",consent:true,question:"How many?",answer:"three"}).length===0);
t("required fields",()=>validateReport({type:"lost"}).length>=6);t("import shape",()=>validateImport({items:[{id:"x",type:"lost",title:"Wallet"}]}).items.length===1);
t("bad import rejected",()=>{try{validateImport({items:[{}]});return false}catch{return true}});t("export schema",()=>JSON.parse(serializeData({items:[]})).version===1);t("storage probe boolean",()=>typeof storageAvailable()==="boolean");o.prepend(Object.assign(document.createElement("li"),{textContent:"Result: "+ok+" passed, "+bad+" failed"}))};
</script></body></html>
